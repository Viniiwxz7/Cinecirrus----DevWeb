<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #F4F1EA; display: flex; flex-direction: column; padding: 48px; position: relative; }
    .motif { position: absolute; top: 0; left: 0; width: 100%; height: 6px; display: flex; }
    .motif-blue { background: #0D1321; width: 80%; }
    .motif-amber { background: #F5A623; width: 20%; }
    header { padding-top: 10px; margin-bottom: 30px; }
    h2 { font-family: 'Playfair Display', serif; font-size: 48px; color: #0D1321; }
    .layout { display: flex; flex-direction: column; gap: 24px; flex: 1; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .example { background: #fff; padding: 24px; border-radius: 12px; border: 1px solid #dce3ee; }
    .code { background: #1A2238; color: #E0FBFC; padding: 24px; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.4; }
    input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #eee; border-radius: 4px; }
    summary { font-weight: bold; cursor: pointer; padding: 8px; background: #f8fafc; }
    .page-num { position: absolute; bottom: 48px; right: 48px; font-family: 'Inter', sans-serif; color: #1D2D44; opacity: 0.5; font-size: 14px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif"><div class="motif-blue"></div><div class="motif-amber"></div></div>
    <header><h2>Componentes 3 e 4: Form e Accordion</h2></header>
    <div class="layout">
      <div class="row">
        <div class="example">
          <label style="font-size:14px">Nome do Filme
            <input type="text" placeholder="Ex: Titanic" />
          </label>
        </div>
        <div class="code">
<pre>&lt;!-- 3. Form (Input) --&gt;
&lt;label&gt;Nome do Filme
  &lt;input type="text" /&gt;
&lt;/label&gt;</pre>
        </div>
      </div>
      <div class="row">
        <div class="example">
          <details open>
            <summary>Sinopse</summary>
            <p style="padding:10px;font-size:14px">Texto oculto do filme...</p>
          </details>
        </div>
        <div class="code">
<pre>&lt;!-- 4. Accordion --&gt;
&lt;details&gt;
  &lt;summary&gt;Sinopse&lt;/summary&gt;
  &lt;p&gt;Resumo do filme vai aqui.&lt;/p&gt;
&lt;/details&gt;</pre>
        </div>
      </div>
    </div>
    <div class="page-num">06</div>
  </div>
</body>
</html>
