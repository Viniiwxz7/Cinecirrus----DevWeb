<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #0D1321; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .motif { position: absolute; top: 0; left: 0; width: 100%; height: 6px; display: flex; }
    .motif-blue { background: #0D1321; width: 80%; }
    .motif-amber { background: #F5A623; width: 20%; }
    .content { text-align: center; color: #F4F1EA; max-width: 900px; }
    .eyebrow { font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.2em; color: #00B4D8; font-weight: 700; margin-bottom: 2rem; font-size: 1.2rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: 80px; line-height: 1.1; margin-bottom: 1.5rem; color: #F5A623; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 24px; color: #F4F1EA; opacity: 0.8; margin-bottom: 3rem; }
    .footer { position: absolute; bottom: 48px; font-family: 'Inter', sans-serif; color: #00B4D8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif"><div class="motif-blue"></div><div class="motif-amber"></div></div>
    <div class="content">
      <p class="eyebrow">Frameworks CSS & Interfaces Web</p>
      <h1>Cirrus CSS no CineCirrus</h1>
      <p class="subtitle">Componentes modulares para interfaces de cinema ágeis e leves.</p>
    </div>
    <div class="footer">Parte 2 & 3: Apresentação de Framework</div>
  </div>
</body>
</html>
